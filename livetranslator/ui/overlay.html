<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>字幕</title>
<link rel="stylesheet" href="/ui/tokens.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: var(--font); color: #fff; -webkit-user-select: none; user-select: none; cursor: grab; }
  .bar {
    position: absolute; inset: 6px; border-radius: 18px; padding: 36px 22px 14px;
    background: rgba(12, 13, 19, var(--op, .86)); display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.07);
    -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
  }
  .dst { flex: none; font-size: var(--fs, 26px); font-weight: 650; line-height: 1.32; letter-spacing: .01em;
    text-shadow: 0 1px 2px rgba(0,0,0,.5); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dst.wait { color: rgba(255,255,255,.55); font-weight: 500; }
  .src { font-size: calc(var(--fs, 26px) * .55); color: #b9bfd4; line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src .who { color: #8a90a6; margin-right: 8px; font-weight: 600; }
  .src.hide { display: none; }
  .caret { display: inline-block; width: .32em; height: .9em; margin-left: 3px; background: #6fd6a8; border-radius: 2px;
    vertical-align: -.08em; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .live { position: absolute; left: 22px; top: 12px; display: flex; align-items: center; gap: 6px; font-size: 11px;
    color: rgba(255,255,255,.5); letter-spacing: .04em; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #6b7085; }
  .live.on i { background: #6fd6a8; box-shadow: 0 0 0 3px rgba(111,214,168,.2); }
  .tools { position: absolute; right: 14px; top: 10px; display: flex; gap: 4px; opacity: 0; transition: opacity .18s; }
  body:hover .tools { opacity: 1; }
  .tools button { height: 26px; min-width: 26px; padding: 0 8px; border-radius: 7px; border: 0; cursor: pointer;
    background: rgba(255,255,255,.1); color: #fff; font: 600 12px var(--font); display: inline-flex; align-items: center; gap: 4px; }
  .tools button:hover { background: rgba(255,255,255,.2); }
  .tools button.stop { background: rgba(242,132,156,.22); color: #ffd6df; }
  .tools button.stop:hover { background: #f2849c; color: #1a0b10; }
  .tools button.go { background: #6fd6a8; color: #0b1a13; }
  svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
<script>window.LT_TOKEN = "__LT_TOKEN__";</script>
</head>
<body class="pywebview-drag-region">
  <div class="bar" id="bar">
    <div class="live" id="live"><i></i><span id="live-t">待机</span></div>
    <div class="tools">
      <button id="smaller" title="缩小字号">A−</button>
      <button id="bigger" title="放大字号">A+</button>
      <button id="toggle-src" title="显示 / 隐藏原文">原文</button>
      <button id="rec" title="开始 / 结束"></button>
      <button id="expand" title="回到主窗口"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>主窗口</button>
    </div>
    <div class="dst wait" id="dst">字幕条已就绪 · 开始录制后，译文会显示在这里</div>
    <div class="src" id="src"></div>
  </div>
<script>
'use strict';
const T = window.LT_TOKEN;
const $ = s => document.querySelector(s);
const api = (name, args = {}) => fetch(`/api/${name}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-LT-Token': T }, body: JSON.stringify(args) })
  .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error); return j.result; });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let cfg = {}, active = false, last = null, interim = null;
const entries = new Map();

function applyCfg() {
  document.body.style.setProperty('--fs', `${cfg.subtitle_font_size || 26}px`);
  document.body.style.setProperty('--op', cfg.subtitle_opacity ?? .86);
  $('#src').classList.toggle('hide', cfg.subtitle_show_source === false);
}
function render() {
  const dst = $('#dst'), src = $('#src');
  const e = last ? entries.get(last) : null;
  if (interim && (!e || interim.id > e.id)) {
    // 有人正在说：上一句译文保留在大字，新原文流在小字
    if (e && e.translation) { dst.className = 'dst'; dst.textContent = e.translation; }
    else { dst.className = 'dst wait'; dst.textContent = '…'; }
    src.innerHTML = `<span class="who">${esc(interim.speaker)}</span>${esc(interim.source)}`;
  } else if (e) {
    dst.className = e.translation ? 'dst' : 'dst wait';
    dst.innerHTML = e.translation ? esc(e.translation) + (e.translating ? '<span class="caret"></span>' : '') : '翻译中…';
    src.innerHTML = `<span class="who">${esc(e.speaker)}</span>${esc(e.source)}`;
  }
  $('#live').classList.toggle('on', active);
  $('#live-t').textContent = active ? '录制中' : '待机';
  $('#rec').textContent = active ? '■ 结束' : '● 开始';
  $('#rec').className = active ? 'stop' : 'go';
}
function handle(ev) {
  const d = ev.data;
  if (ev.type === 'entry') { entries.set(d.id, d); last = d.id; if (interim && interim.id === d.id) interim = null; }
  else if (ev.type === 'translation') { const e = entries.get(d.id); if (e) { e.translation = d.translation; e.translating = !d.done; } }
  else if (ev.type === 'entry_update') { const e = entries.get(d.id); if (e) Object.assign(e, d); }
  else if (ev.type === 'interim') interim = d;
  else if (ev.type === 'interim_clear') { if (interim && interim.id === d.id) interim = null; }
  else if (ev.type === 'session') { active = !!d.active; if (d.active && d.elapsed < 2) { entries.clear(); last = null; } }
  else if (ev.type === 'config') { cfg = d; applyCfg(); }
  else return false;
  return true;
}
const setPref = (key, value) => { cfg[key] = value; applyCfg(); api('set_pref', { key, value }).catch(() => {}); };
$('#smaller').onclick = () => setPref('subtitle_font_size', Math.max(16, (cfg.subtitle_font_size || 26) - 2));
$('#bigger').onclick = () => setPref('subtitle_font_size', Math.min(48, (cfg.subtitle_font_size || 26) + 2));
$('#toggle-src').onclick = () => setPref('subtitle_show_source', cfg.subtitle_show_source === false);
const flash = t => { const d = $('#dst'); d.className = 'dst wait'; d.textContent = t; };
$('#rec').onclick = async () => {
  try {
    if (active) { await api('end_session'); return; }
    const r = await api('start_session');
    if (!r.ok) flash(`模型后端未就绪（${r.message}）· 回主窗口处理`);
  } catch (e) { flash(e.message); }
};
$('#expand').onclick = () => api('close_overlay').then(r => { if (!r.ok) window.close(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#expand').click(); });

api('bootstrap').then(b => {
  cfg = b.config; active = b.session.active;
  for (const e of b.entries) { entries.set(e.id, e); last = e.id; }
  applyCfg(); render();
  const es = new EventSource(`/events?token=${encodeURIComponent(T)}&client=overlay`);
  es.onmessage = m => {
    const p = JSON.parse(m.data); let dirty = false;
    for (const ev of p.events) dirty = handle(ev) || dirty;
    if (dirty) render();
  };
});
</script>
</body>
</html>
