<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时翻译</title>
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/app.css">
<script>window.LT_TOKEN = "__LT_TOKEN__";</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 7h9M8.5 4v3M6 7c.6 3.6 3 6.4 6 7.5M11 7c-.7 3.4-3.2 6.5-6.5 8"/><path d="M13 20l3.5-8.5L20 20M14.3 17h4.4"/></symbol>
    <symbol id="i-live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 16.2a6 6 0 0 0 0-8.4M5 5a10 10 0 0 0 0 14M19 19a10 10 0 0 0 0-14"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19M9 7h6M9 10.5h4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6M12 17h.01"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
    <symbol id="i-media" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M10 8.5l4 1.5-4 1.5z"/></symbol>
    <symbol id="i-sub" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 15h6M15.5 15H17M7 11.5h2M11.5 11.5H17"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v5h14v-5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4 2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.4l-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l.9 12.5h9.2L17.5 7M10 11v5M14 11v5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8h.01"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M15.5 5.6a3.2 3.2 0 0 1 0 5.8M17 14.2a5.5 5.5 0 0 1 3.5 4.8"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18.5l-1.8-5.9L4.5 10.8 10.2 9z"/></symbol>
    <symbol id="i-columns" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M12 4.5v15"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6.5h12M8 12h12M8 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3zM12 14v6"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M5 20v-6M5 10V4M12 20v-8M12 8V4M19 20v-4M19 12V4M3 14h4M10 8h4M17 16h4"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2M21 12h0"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <nav class="rail" aria-label="主导航">
    <div class="rail-logo" title="LiveTranslator"><svg class="i lg"><use href="#i-logo"/></svg></div>
    <button class="rail-btn" data-nav="live" aria-current="page"><svg class="i lg"><use href="#i-live"/></svg>实时<span class="dot live hidden" id="nav-live-badge" style="position:absolute;top:8px;right:14px;width:7px;height:7px"></span></button>
    <button class="rail-btn" data-nav="library"><svg class="i lg"><use href="#i-library"/></svg>记录库<span class="badge hidden" id="nav-lib-badge"></span></button>
    <button class="rail-btn" data-nav="terms"><svg class="i lg"><use href="#i-book"/></svg>术语表</button>
    <button class="rail-btn" data-nav="settings"><svg class="i lg"><use href="#i-settings"/></svg>设置</button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="nav-help"><svg class="i lg"><use href="#i-help"/></svg>帮助</button>
    <button class="rail-status" id="nav-backend" title="模型后端状态"><span class="dot" id="backend-dot"></span><span id="backend-label">检查中</span></button>
  </nav>

  <main>
    <!-- 实时 -->
    <section class="page active" id="page-live" aria-label="实时翻译">
      <header class="page-head">
        <button class="rec-btn" id="rec-btn"><span class="glyph"></span><span id="rec-label">开始录制</span><span class="kbd">⌘R</span></button>
        <div class="session-stats" id="session-stats">
          <span class="timer num" id="timer">00:00</span>
          <span class="sep"></span>
          <span><b class="num" id="stat-count">0</b> 句</span>
          <span class="hide-sm">平均延迟 <b class="num" id="stat-latency">—</b></span>
          <span class="hide-sm hidden" id="stat-pending"></span>
        </div>
        <div class="grow"></div>
        <select class="select" id="pair-select" style="width:auto" title="语言对"></select>
        <div class="seg" id="view-seg" role="group" aria-label="视图">
          <button data-view="timeline" title="时间线（⌘1 切换）"><svg class="i sm"><use href="#i-list"/></svg>时间线</button>
          <button data-view="columns" title="分语种对照"><svg class="i sm"><use href="#i-columns"/></svg>对照</button>
        </div>
        <button class="btn ghost icon" id="btn-import" title="导入音频 / 视频文件"><svg class="i"><use href="#i-import"/></svg></button>
        <button class="btn ghost icon" id="btn-pin" title="窗口置顶"><svg class="i"><use href="#i-pin"/></svg></button>
        <button class="btn outline" id="btn-subtitle" title="切换到桌面字幕条（⌘⇧S）"><svg class="i"><use href="#i-sub"/></svg>字幕条</button>
      </header>
      <div class="live-body">
        <aside class="console" id="console" aria-label="音源控制台"></aside>
        <div class="stage">
          <div class="transcript" id="transcript" tabindex="-1"></div>
          <button class="new-pill hidden" id="new-pill"><svg class="i sm"><use href="#i-arrow-down"/></svg><span></span></button>
          <div class="live-strip" id="live-strip">
            <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="txt" id="live-text">待识别的语音会先出现在这里</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 记录库 -->
    <section class="page" id="page-library" aria-label="记录库">
      <header class="page-head">
        <h1 class="page-title">记录库</h1>
        <span class="page-sub" id="lib-count"></span>
        <div class="grow"></div>
        <button class="btn ghost" id="lib-import"><svg class="i"><use href="#i-import"/></svg>导入音频/视频</button>
        <button class="btn ghost" id="lib-open-dir"><svg class="i"><use href="#i-folder"/></svg>打开文件夹</button>
      </header>
      <div class="lib-body">
        <div class="lib-list">
          <div class="lib-tools">
            <label class="search"><svg class="i sm"><use href="#i-search"/></svg><input class="input" id="lib-search" placeholder="搜索标题、原文、译文、纪要…  ⌘F" type="search"></label>
            <div class="seg" id="lib-filter" style="align-self:flex-start">
              <button data-f="all" aria-pressed="true">全部</button>
              <button data-f="starred">有标记</button>
              <button data-f="attention">待处理</button>
            </div>
          </div>
          <div class="lib-items" id="lib-items" role="listbox" aria-label="记录列表"></div>
        </div>
        <div class="detail" id="lib-detail"></div>
      </div>
    </section>

    <!-- 术语表 -->
    <section class="page" id="page-terms" aria-label="术语表">
      <header class="page-head">
        <h1 class="page-title">术语表</h1>
        <span class="page-sub" id="terms-count"></span>
        <div class="grow"></div>
        <label class="search" style="width:240px"><svg class="i sm"><use href="#i-search"/></svg><input class="input" id="terms-search" placeholder="筛选术语" type="search"></label>
        <button class="btn primary" id="terms-add"><svg class="i"><use href="#i-plus"/></svg>添加术语</button>
      </header>
      <div class="form-page" id="terms-page"></div>
    </section>

    <!-- 设置 -->
    <section class="page" id="page-settings" aria-label="设置">
      <header class="page-head">
        <h1 class="page-title">设置</h1>
        <div class="grow"></div>
        <span class="page-sub selectable" id="cfg-path"></span>
      </header>
      <div class="form-page" id="settings-page"></div>
    </section>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="jobs" id="jobs" aria-live="polite"></div>
<script src="/ui/app.js"></script>
</body>
</html>
